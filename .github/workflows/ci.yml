name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check (php -l)
        run: git ls-files '*.php' | xargs -n1 php -l >/dev/null

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: Build
        run: php build.php build
      - name: Syntax check built file
        run: php -l build/index.php
      - name: Smoke test (server responds)
        run: |
          php -S 127.0.0.1:8000 -t build >/dev/null 2>&1 &
          sleep 1
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          echo "HTTP $code"
          [ "$code" -lt 500 ]
